[project]
name = "duckbot-host"
version = "0.1.0"
description = "Duckbot host process — JSON-RPC over stdio for the desktop shell"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "duckbot-schemas",
    "duckbot-core",
    "duckbot-privacy",
    "duckbot-memory",
    "pydantic>=2,<3",
]

[project.scripts]
duckbot-host = "duckbot_host.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duckbot_host = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "RUF"]
ignore = ["E501", "EXE002", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["duckbot_host"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
