[package]
name = "duckbot-shell"
version = "0.1.0"
description = "Duckbot desktop shell"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No shell plugin: the sidecar is spawned directly in sidecar.rs, so the plugin would
# be build time spent on a dependency nothing calls.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Kept so a release build cannot accidentally ship developer conveniences.
default = []
