[project]
name = "duckbot-engine"
version = "0.1.0"
description = "Duckbot task engine — privacy-preserving composition of memory, policy and models"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "duckbot-schemas",
    "duckbot-core",
    "duckbot-privacy",
    "duckbot-gateway",
    "duckbot-memory",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duckbot_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["duckbot_engine"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
