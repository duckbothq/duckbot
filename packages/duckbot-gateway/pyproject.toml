[project]
name = "duckbot-gateway"
version = "0.1.0"
description = "Duckbot model gateway — routing, adapters and per-call cost accounting"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["duckbot-schemas", "duckbot-core", "pydantic>=2,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duckbot_gateway = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "RUF"]
ignore = ["E501", "EXE002", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["duckbot_gateway"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
