name: licences

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. A dependency's licence can change in a patch release, and nobody notices
    # until something forces them to look.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  licence-gate:
    name: licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # EVERY package, not just the schemas. The gate scans the resolved environment,
      # so a package that is not installed contributes no dependencies to scan — and a
      # gate that silently covers less than people believe is worse than an obvious gap.
      # Schemas goes first and alone so that the named `duckbot-schemas` requirement in
      # the others is already satisfied and pip never looks for that name on PyPI.
      - name: Install every package and its resolved dependency tree
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/duckbot-schemas
          pip install ./packages/duckbot-core
          pip install ./packages/duckbot-privacy ./packages/duckbot-gateway

      - name: Test the gate itself
        run: |
          pip install pytest
          pytest scripts/test_check_licences.py -q

      # Runs against the RESOLVED environment, so transitive dependencies are covered.
      # A direct-only scan would miss a permissive wrapper around a copyleft binary,
      # which is the case duckbot_dependency_licence_register.md documents.
      - name: Check licences
        run: python scripts/check_licences.py --write-notices THIRD_PARTY_LICENSES

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --outfile sbom.json || \
            echo "SBOM generation failed; not blocking the build, the licence gate above is the gate"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licence-report
          path: |
            THIRD_PARTY_LICENSES
            sbom.json
          if-no-files-found: warn
