name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.package }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        package:
          [duckbot-schemas, duckbot-core, duckbot-privacy, duckbot-gateway, duckbot-memory]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Schemas goes in first and on its own. The other packages declare
      # `duckbot-schemas` as an ordinary named dependency, and if it is not already
      # installed pip will go looking for that name on PyPI — where it is not ours.
      # Installing it first means the requirement is already satisfied and the index is
      # never consulted for it. See PRIVACY-PUSH-INSTRUCTIONS.md.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/duckbot-schemas
          pip install ./packages/duckbot-core
          pip install ./packages/duckbot-privacy ./packages/duckbot-gateway \
            ./packages/duckbot-memory pytest

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: pytest -q

  recall:
    name: detection recall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/duckbot-schemas
          pip install ./packages/duckbot-privacy

      # The thresholds are asserted in tests/test_recall.py, which the test job runs.
      # This job exists so the figure is visible in the build log without anyone having
      # to run it locally: a number nobody looks at is a number that quietly rots.
      - name: Measure
        working-directory: packages/duckbot-privacy
        run: python scripts_measure.py corpus/hk_business_v1.json

  lint:
    name: lint and types (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: duckbot-schemas
            module: duckbot_schemas
          - package: duckbot-core
            module: duckbot_core
          - package: duckbot-privacy
            module: duckbot_privacy
          - package: duckbot-gateway
            module: duckbot_gateway
          - package: duckbot-memory
            module: duckbot_memory

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/duckbot-schemas
          pip install ./packages/duckbot-core
          pip install ./packages/duckbot-privacy ./packages/duckbot-gateway \
            ./packages/duckbot-memory
          pip install ruff==0.16.8 mypy==2.3.1

      # All three gates block. They were clean when this workflow was written, so
      # there is no reason to start them as warnings — a gate everyone has learned to
      # ignore is worse than no gate.
      #
      # ruff and mypy are pinned. Unpinned, a tool release turns the build red with no
      # change to our code, and the person who has to deal with it is whoever happens to
      # push next. Dependabot proposes the bump, and then the upgrade is a reviewed pull
      # request with the new findings visible in it, which is where that work belongs.
      - name: ruff check
        working-directory: packages/${{ matrix.package }}
        run: ruff check src tests

      - name: ruff format
        working-directory: packages/${{ matrix.package }}
        run: ruff format --check src tests

      - name: mypy (strict)
        working-directory: packages/${{ matrix.package }}
        run: mypy --strict src/${{ matrix.module }}
        env:
          MYPYPATH: src
